name: Build & Package Anima Engine

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tao ban phat hanh GitHub Release chinh thuc'
        required: false
        type: boolean
        default: true
      version_tag:
        description: 'Tag phien ban (vi du: v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run Test Suite
        run: |
          python -m unittest discover tests
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Build Tauri Application & Bundles
        run: npx tauri build

      - name: Prepare Portable Package
        shell: pwsh
        run: |
          $portableDir = "AnimaEngine-v1.0.0-Portable"
          New-Item -ItemType Directory -Path $portableDir -Force
          
          # Tim file exe da build (animaengine.exe hoac app.exe)
          $exe = Get-ChildItem -Path "src-tauri\target\release" -Filter "*.exe" | Where-Object { $_.Name -in "animaengine.exe", "app.exe" } | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "$portableDir\animaengine.exe"
            Copy-Item $exe.FullName -Destination "$portableDir\app.exe"
          } else {
            Write-Error "Khong tim thay tep thuc thi trong release!"
            exit 1
          }
          
          Copy-Item "run.bat" -Destination "$portableDir\"
          Copy-Item "stop.bat" -Destination "$portableDir\"
          if (Test-Path "HUONG_DAN_SU_DUNG.md") {
            Copy-Item "HUONG_DAN_SU_DUNG.md" -Destination "$portableDir\"
          }

          Compress-Archive -Path "$portableDir\*" -DestinationPath "AnimaEngine-v1.0.0-Portable-Windows-x64.zip" -Force
          Write-Host "Da dong goi thanh cong Portable Zip!"

      - name: Upload Artifacts (Portable & Installer)
        uses: actions/upload-artifact@v4
        with:
          name: AnimaEngine-Windows-x64
          path: |
            AnimaEngine-v1.0.0-Portable-Windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "Anima Engine ${{ github.event.inputs.version_tag || github.ref_name }} (Release)"
          body: |
            ## Anima Engine - Desktop Mascot Blue Archive
            
            ### Danh sách gói tải về:
            - **Bản Portable (Chạy ngay không cần cài đặt)**: `AnimaEngine-v1.0.0-Portable-Windows-x64.zip`
              - Giải nén ra thư mục bất kỳ và nhấp đúp `run.bat` để chạy ngay!
            - **Bản Cài đặt (Setup Installer)**:
              - `animaengine_*_x64-setup.exe` (NSIS Installer)
              - `animaengine_*_x64_en-US.msi` (Windows Installer)
            
            ### Yêu cầu hệ thống:
            - Windows 10 / Windows 11 (64-bit).
            - Microsoft Edge WebView2 Runtime (đã tích hợp sẵn trên hầu hết các máy Windows 10/11).
          files: |
            AnimaEngine-v1.0.0-Portable-Windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
