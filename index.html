<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anima Engine</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="mascot-container">
      <!-- Bong bóng thoại hội thoại -->
      <div id="speech-bubble" class="speech-bubble hidden">
        <span id="speech-text">Sensei, có việc gì cần tôi giúp không?</span>
        <div class="speech-arrow"></div>
      </div>

      <!-- Khung nhân vật Chibi Mascot (Hỗ trợ 2D Sprite và 3D WebGL Canvas) -->
      <div id="chibi-wrapper" class="chibi-wrapper">
        <img id="chibi-img" src="/characters/hina/animations/idle.png" alt="Chibi 2D" draggable="false" />
        <canvas id="chibi-canvas" class="chibi-canvas hidden"></canvas>
      </div>

      <!-- Trình phát âm thanh thoại -->
      <audio id="voice-player"></audio>

      <!-- Menu ngữ cảnh (chuột phải) -->
      <div id="context-menu" class="context-menu hidden">
        <div class="menu-header">Tương tác nhanh:</div>
        <div class="menu-item action-btn" data-action="poke">💕 Xoa đầu / Vuốt ve</div>
        <div class="menu-item action-btn" data-action="salute">🫡 Chào Sensei!</div>
        <div class="menu-item action-btn" data-action="praise">💖 Khen thưởng / Cưng chiều</div>
        <div class="menu-item action-btn" data-action="focus">📖 Cùng tập trung làm việc</div>
        <div class="menu-item action-btn" data-action="teatime">☕ Giờ giải lao / Trà chiều</div>
        <div class="menu-divider"></div>
        <div class="menu-header">Chọn nhân vật:</div>
        <div class="menu-item char-option active" data-char="hina">🌸 Hina (2D Chibi)</div>
        <div class="menu-item char-option" data-char="hina_dress">👗 Hina - Dạ Hội (3D)</div>
        <div class="menu-item char-option" data-char="hanako">🌺 Hanako (3D)</div>
        <div class="menu-item char-option" data-char="airi">🎸 Airi - Band (3D)</div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menu-mute">Bật/Tắt âm thanh 🔊</div>
        <div class="menu-item menu-exit" id="menu-exit">Thoát ứng dụng ✕</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
